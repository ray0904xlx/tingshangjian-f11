services:
  - type: web
    name: tingshangjian-f11
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: PYTHON_VERSION
        value: 3.12.7
