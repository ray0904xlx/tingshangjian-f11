services:
  - type: web
    name: tingshangjian-f11
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_JSON_MODE
        value: "0"
      - key: LLM_REASONING_EFFORT
        value: minimal
      - key: LLM_TIMEOUT
        value: "45"
      - key: LLM_API_KEY
        sync: false
