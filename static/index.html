<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>庭上見｜F11 單人 AI 模擬法庭</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#222; --muted:#6b6b6b; --accent:#7a5c2e; --line:#e3ded3; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#3b2f1e; color:#fff; padding:12px 16px; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.75; }
  .wrap { max-width:1000px; margin:0 auto; padding:12px; display:grid; grid-template-columns: 1fr 260px; gap:12px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .steps { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .step { flex:1; min-width:90px; text-align:center; font-size:12px; padding:6px 4px; border-radius:6px; background:#e9e4d8; color:var(--muted); }
  .step.done { background:#d6cbb1; color:#3b2f1e; }
  .step.now { background:var(--accent); color:#fff; font-weight:bold; }
  .hint { background:#fff8e6; border:1px solid #ecd9a8; border-radius:8px; padding:8px 10px; font-size:14px; margin-bottom:8px; }
  .chat { background:var(--card); border:1px solid var(--line); border-radius:10px; height:55vh; overflow-y:auto; padding:12px; }
  .msg { margin:8px 0; max-width:85%; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .msg .bubble { padding:8px 11px; border-radius:10px; background:#f1eee7; line-height:1.55; white-space:pre-wrap; }
  .msg.plaintiff { margin-left:auto; text-align:right; }
  .msg.plaintiff .bubble { background:#3b2f1e; color:#fff; text-align:left; }
  .msg.judge .bubble { background:#efe6d2; }
  .msg.defendant .bubble { background:#e7eef5; }
  .msg.witness .bubble { background:#e9f3e6; }
  .msg.violation .bubble { background:#fdecea; border:1px solid #f3b8b2; color:var(--warn); }
  .msg.system { max-width:100%; text-align:center; }
  .msg.system .bubble { background:none; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; margin-top:8px; }
  textarea { flex:1; resize:none; height:56px; padding:8px; font-size:15px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  aside .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; font-size:14px; }
  aside h3 { margin:0 0 6px; font-size:14px; }
  .chip { display:block; width:100%; text-align:left; background:#f4f0e6; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:4px 0; font-size:13px; }
  .chip.used { opacity:.55; }
  .note { font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>庭上見｜單人 AI 模擬法庭（F11）</h1>
  <small id="caseInfo">載入中…</small>
</header>
<div class="wrap">
  <main>
    <div class="steps" id="steps"></div>
    <div class="hint" id="hint"></div>
    <div class="chat" id="chat"></div>
    <form id="form">
      <textarea id="input" placeholder="輸入你的發言（Enter 送出，Shift+Enter 換行）"></textarea>
      <button id="send">發言</button>
    </form>
  </main>
  <aside>
    <div class="box">
      <h3>證物清單（點一下帶入）</h3>
      <div id="evidence"></div>
    </div>
    <div class="box">
      <h3>證人</h3>
      <button class="chip" id="witnessBtn"></button>
    </div>
    <div class="box">
      <h3>快速發言</h3>
      <button class="chip" data-say="沒有意見。">沒有意見</button>
      <button class="chip" data-say="沒有其他證據要調查。">沒有其他證據</button>
      <button class="chip" data-say="沒有補充。">沒有補充</button>
    </div>
    <div class="box">
      <button id="restart" style="width:100%;padding:8px">重新開始</button>
      <p class="note" id="notes"></p>
      <p class="note">本平台為教育用途，不提供個案法律意見。</p>
    </div>
  </aside>
</div>
<script>
let sid = null, busy = false;
const $ = (id) => document.getElementById(id);

function addMessages(msgs) {
  for (const m of msgs) {
    const div = document.createElement("div");
    div.className = "msg " + (m.kind === "violation" ? "violation" : m.kind === "system" ? "system" : m.role);
    const who = m.kind === "violation" ? "⚠ 審判長提醒" : m.kind === "system" ? "" : m.speaker;
    div.innerHTML = (who ? `<div class="who"></div>` : "") + `<div class="bubble"></div>`;
    if (who) div.querySelector(".who").textContent = who;
    div.querySelector(".bubble").textContent = m.text;
    $("chat").appendChild(div);
  }
  $("chat").scrollTop = $("chat").scrollHeight;
}

function render(state) {
  const c = state.case;
  $("caseInfo").textContent = `${c.court}｜${c.case_no}｜你是原告 ${c.plaintiff}`;
  $("steps").innerHTML = "";
  state.stages.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "step" + (i < state.stage.index ? " done" : i === state.stage.index ? " now" : "");
    d.textContent = s.name;
    $("steps").appendChild(d);
  });
  $("hint").textContent = `現在程序：${state.stage.name}｜${state.stage.hint}`;
  $("evidence").innerHTML = "";
  for (const e of state.evidence) {
    const b = document.createElement("button");
    b.className = "chip" + (e.presented ? " used" : "");
    b.textContent = `${e.id} ${e.name}${e.owner === "defendant" ? "（被告提出）" : ""}${e.presented ? " ✓" : ""}`;
    b.onclick = () => insert(e.owner === "plaintiff" ? `提出${e.id}${e.name}。` : `對${e.id}${e.name}表示意見：`);
    $("evidence").appendChild(b);
  }
  $("witnessBtn").textContent = state.witness_sworn ? `詢問證人 ${state.witness}` : `聲請傳喚證人 ${state.witness}`;
  $("witnessBtn").onclick = () => insert(state.witness_sworn ? `請問證人，` : `聲請傳喚證人${state.witness}。`);
  $("notes").textContent = c.teaching_notes.join(" ");
  $("send").disabled = state.finished;
  $("input").disabled = state.finished;
}

function insert(t) { $("input").value = t; $("input").focus(); }

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function start() {
  $("chat").innerHTML = "";
  const data = await api("/api/sessions", { case_id: "rent_deposit_01" });
  sid = data.state.session_id;
  addMessages(data.messages);
  render(data.state);
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("input").value = "";
  try {
    const data = await api(`/api/sessions/${sid}/turn`, { text });
    addMessages(data.messages);
    render(data.state);
  } catch (err) {
    addMessages([{ kind: "system", text: "連線失敗：" + err.message }]);
  } finally { busy = false; if (!$("input").disabled) $("send").disabled = false; }
};
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => insert(b.dataset.say));
$("restart").onclick = start;
start();
</script>
</body>
</html>
